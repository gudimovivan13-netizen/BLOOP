<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLOOP — мессенджер</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237aa2ff'/%3E%3Ccircle cx='12' cy='16' r='6' fill='white'/%3E%3Ccircle cx='20' cy='16' r='6' fill='%23475a94'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Экран входа / регистрации -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">BLOOP</div>
      <div class="auth-subtitle">твой мессенджер</div>
      <div class="auth-tabs">
        <button type="button" class="tab active" data-tab="login">Вход</button>
        <button type="button" class="tab" data-tab="register">Регистрация</button>
      </div>

      <form id="login-form" autocomplete="on">
        <input id="login-username" type="text" placeholder="Логин" autocomplete="username" required>
        <input id="login-password" type="password" placeholder="Пароль" autocomplete="current-password" required>
        <button type="submit" class="primary">Войти</button>
      </form>

      <form id="register-form" class="hidden" autocomplete="on">
        <input id="reg-username" type="text" placeholder="Логин (латиница, 3–20)" autocomplete="username" required>
        <input id="reg-display" type="text" placeholder="Имя, которое увидят другие" autocomplete="nickname">
        <input id="reg-password" type="password" placeholder="Пароль (от 6 символов)" autocomplete="new-password" required>
        <button type="submit" class="primary">Создать аккаунт</button>
      </form>

      <div id="auth-error" class="auth-error"></div>
    </div>
  </div>

  <!-- Основное приложение -->
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <header class="side-head">
        <span class="side-logo">BLOOP</span>
        <button id="btn-group" class="ghost-btn" title="Новая группа">+ Группа</button>
        <button id="btn-logout" class="icon-btn" title="Выйти">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16 13v-2H7V8l-5 4 5 4v-3h9zm3-10H11v2h8v14h-8v2h10V3z"/></svg>
        </button>
      </header>

      <div class="side-me">
        <span id="my-avatar" class="avatar"></span>
        <span id="my-name" class="my-name"></span>
      </div>

      <input id="search" type="search" placeholder="Найти человека…">

      <div id="search-results" class="search-results hidden"></div>
      <nav id="chat-list" class="chat-list"></nav>
    </aside>

    <main class="chat-pane" id="chat-pane">
      <div id="empty-state" class="empty-state">
        <div class="empty-bubble"></div>
        <p>Выберите чат слева<br>или найдите человека, чтобы начать общение</p>
      </div>

      <div id="chat-view" class="chat-view hidden">
        <header class="chat-head">
          <button id="btn-back" class="icon-btn back" title="Назад">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 4.5 8 12l7.5 7.5-1.8 1.8L4.5 12 13.7 2.7z"/></svg>
          </button>
          <span id="chat-avatar" class="avatar"></span>
          <div class="chat-title">
            <div id="chat-name"></div>
            <div id="chat-status" class="chat-status"></div>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <div id="typing-bar" class="typing-bar hidden">печатает…</div>

        <footer class="composer">
          <label class="icon-btn attach" title="Прикрепить изображение">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21 6.8 17.2 3a3.6 3.6 0 0 0-5.1 0l-9 9a5.2 5.2 0 0 0 7.3 7.3l8.3-8.3-1.4-1.4-8.3 8.3a3.2 3.2 0 0 1-4.5-4.5l9-9a1.6 1.6 0 0 1 2.3 2.3l-8.3 8.3a.8.8 0 0 1-1.1-1.1l7.6-7.6L12.6 3 5 10.6a2.8 2.8 0 0 0 4 4l8.3-8.4z"/></svg>
            <input id="file-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
          </label>
          <textarea id="msg-input" rows="1" placeholder="Сообщение…"></textarea>
          <button id="btn-send" class="send-btn" title="Отправить">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2.7 11.2 20.9 3.4c.8-.3 1.6.4 1.3 1.3l-6 18.2c-.3.9-1.5.9-1.9.1l-3.4-7-7.3-3.1c-.9-.4-.9-1.5.1-1.7zm7.4 2.6 2.4 5 4-12.1-12 5.1 4.6 1.6.9-.4z"/></svg>
          </button>
        </footer>
      </div>
    </main>

    <!-- Модальное окно создания группы -->
    <div id="group-modal" class="modal hidden">
      <div class="modal-card">
        <h3>Новая группа</h3>
        <input id="group-name" type="text" placeholder="Название группы" maxlength="60">
        <div id="group-users" class="group-users"></div>
        <div class="modal-actions">
          <button id="group-cancel" class="ghost-btn">Отмена</button>
          <button id="group-create" class="primary">Создать</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
