name: Android APK

# Сборка debug-APK BLOOP: www из public/ в локальном режиме (без сервера).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Собрать веб-ассеты (локальный режим)
        run: |
          cd app
          npm ci
          npm run build:www
          npx cap sync android

      - name: Собрать APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: BLOOP-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Опубликовать в release (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/android/app/build/outputs/apk/debug
          cp app-debug.apk BLOOP.apk
          gh release create apk-latest --title "BLOOP Android (debug)" \
            --notes "Автосборка debug-APK. Установка: разрешить «из этого источника» и открыть BLOOP.apk" || true
          gh release upload apk-latest BLOOP.apk --clobber
